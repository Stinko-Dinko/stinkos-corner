name: Publish catalog from Drive

on:
  workflow_dispatch:

# Never allow two spreadsheet publishes to overwrite each other's commits.
concurrency:
  group: stinkos-catalog-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  catalog:
    name: Validate and publish catalog with optimized Drive photos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out approved website preview
        uses: actions/checkout@v4
        with:
          ref: catalog-preview
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive and photography tools
        run: python -m pip install 'gdown==6.3.0' 'pillow==13.0.0'
      - name: Download master spreadsheet and original builder from Drive
        run: |
          mkdir -p /tmp/stinkos-import /tmp/stinkos-output
          gdown --quiet 'https://drive.google.com/uc?id=1A1LGdQ_Gh9Y6aLt08E-3TEQxmhyba_pU' -O /tmp/stinkos-import/Stinkos_Product_Catalog.xlsx
          gdown --quiet 'https://drive.google.com/uc?id=13f36tn1y9pnSImJM-YXYRI0Us7GWpSua' -O /tmp/stinkos-import/build_catalog.py
      - name: Generate catalog from the master workbook
        run: python /tmp/stinkos-import/build_catalog.py /tmp/stinkos-import/Stinkos_Product_Catalog.xlsx /tmp/stinkos-output
      - name: Reject a blank or unfinished catalog before any publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/stinkos-output/catalog.json').read_text(encoding='utf8'))
          products=data.get('products', [])
          live=[p for p in products if p.get('active') and str(p.get('status','')).strip().lower()=='live']
          if not products or not live:
              raise SystemExit('PUBLISH BLOCKED: No active Live products. Your current website remains unchanged. Set status=Live and active=Yes for products to publish.')
          print(f'Workbook validated: {len(products)} products, {len(live)} active Live products.')
          PY
      - name: Discover new or changed Drive product photographs and optimize
        run: python scripts/sync_drive_images.py --catalog /tmp/stinkos-output/catalog.json
      - name: Publish catalog and prepared photographs together
        run: |
          cp /tmp/stinkos-output/catalog.js data/catalog.js
          cp /tmp/stinkos-output/catalog.json data/catalog.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.js data/catalog.json data/image-source-hashes.json images/
          if git diff --cached --quiet; then
            echo "Catalog and photographs are already current. No changes needed."
          else
            git commit -m "Publish Drive catalog and processed product photos"
            git push origin HEAD:catalog-preview
          fi
