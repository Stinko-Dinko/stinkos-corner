name: Optimize storefront photographs

on:
  workflow_dispatch:
  push:
    branches: [catalog-preview]
    paths:
      - '.github/workflows/optimize-photos.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-preview
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install imaging library
        run: python -m pip install pillow
      - name: Optimize all catalog photographs for storefront
        run: python scripts/optimize_catalog_photos.py
      - name: Commit generated images to preview only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/products/ images/cards/
          if git diff --cached --quiet; then
            echo "No images changed"
          else
            git commit -m "Optimize 71 photos and generate burst-filling preview cards"
            git push origin HEAD:catalog-preview
          fi
