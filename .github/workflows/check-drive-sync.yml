name: Verify Drive photo discovery

on:
  push:
    branches: [catalog-preview]
    paths:
      - '.github/workflows/check-drive-sync.yml'
      - 'scripts/sync_drive_images.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public Drive listing and image libraries
        run: python -m pip install 'gdown==6.3.0' pillow
      - name: Run complete catalog photo import without publishing
        run: |
          python scripts/sync_drive_images.py --catalog data/catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=Path('data/catalog.json').read_text()
          d=json.loads(s)
          expected={p for x in d['products'] for p in x.get('images', [])}
          missing=[p for p in expected if not Path(p).is_file() or not Path(p.replace('images/products/', 'images/cards/')).with_suffix('.webp').is_file()]
          if missing:
              raise SystemExit('Missing output images: '+repr(missing[:10]))
          print(f'FULL IMAGE TEST PASSED: {len(expected)} gallery photos and burst cards exist')
          PY
